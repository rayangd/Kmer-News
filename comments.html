<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commentaires — Kmer News Admin</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="icon" href="data:,">
</head>
<body>
<div id="admin-root"></div>

<script>window.KMER_API_BASE = '../api';</script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin-layout.js"></script>
<script>
async function loadComments() {
    const data = await KmerAPI.get('admin/comments.php');
    const tbody = document.getElementById('commentsTableBody');
    if (!data.success) { adminFlash('error', data.message); return; }

    if (data.comments.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6">Aucun commentaire pour le moment.</td></tr>`;
        return;
    }

    tbody.innerHTML = data.comments.map(c => `
        <tr>
            <td style="font-weight:700; white-space:nowrap;">${escapeHtml(c.prenom)} ${escapeHtml(c.nom)}</td>
            <td style="max-width:320px;">${escapeHtml(excerpt(c.contenu, 100))}</td>
            <td><a href="../article.html?slug=${encodeURIComponent(c.article_slug)}" target="_blank">${escapeHtml(excerpt(c.article_titre, 30))}</a></td>
            <td>${timeAgo(c.created_at)}</td>
            <td>${c.statut === 'approuve' ? '<span class="badge badge-green">Visible</span>' : '<span class="badge badge-red">Masqué</span>'}</td>
            <td>
                <div class="action-icons">
                    <button type="button" onclick="toggleComment(${c.id})" title="${c.statut === 'approuve' ? 'Masquer' : 'Approuver'}">${c.statut === 'approuve' ? '🙈' : '✅'}</button>
                    <button type="button" class="confirm-delete" data-confirm="Supprimer ce commentaire ?" onclick="deleteComment(${c.id})" title="Supprimer">🗑️</button>
                </div>
            </td>
        </tr>`).join('');
}

async function toggleComment(id) {
    const r = await KmerAPI.postJson('admin/comments.php', { id, action: 'toggle' });
    if (r.data.success) loadComments(); else adminFlash('error', r.data.message);
}

async function deleteComment(id) {
    const r = await KmerAPI.del('admin/comments.php', { id });
    if (r.data.success) { adminFlash('success', r.data.message); loadComments(); }
    else adminFlash('error', r.data.message);
}

(async () => {
    const admin = await guardAdminPage();
    if (!admin) return;
    renderAdminLayout(admin, 'comments', 'Commentaires');

    document.getElementById('adminBody').innerHTML = `
    <div class="panel">
        <table class="admin-table">
            <thead><tr><th>Auteur</th><th>Commentaire</th><th>Article</th><th>Date</th><th>Statut</th><th>Actions</th></tr></thead>
            <tbody id="commentsTableBody"><tr><td colspan="6">Chargement…</td></tr></tbody>
        </table>
    </div>`;

    loadComments();
})();
</script>
</body>
</html>
