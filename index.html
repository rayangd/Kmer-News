<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accueil — Kmer News | L'info en temps réel</title>
<meta name="description" content="Kmer News, le journal numérique interactif : Culture, Musique, Sport, High-Tech.">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/img/logo.jpg" type="image/jpeg">
</head>
<body>

<div id="site-header"></div>

<section class="hero">
    <div class="container">
        <span class="hero-badge" id="editionDate">Édition du jour</span>
        <h1>L'actu camerounaise,<br>tissée serrée.</h1>
        <p>Cinq rubriques, une seule étoffe : culture, musique, sport, high-tech et société racontent le Cameroun d'aujourd'hui.</p>
        <div class="hero-actions" id="heroActions"></div>
    </div>
</section>
<div class="rubrique-strip"><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span><span class="c5"></span></div>

<div id="rubriques">
    <div class="container" style="padding:40px 24px;"><p style="color:var(--text-muted);">Chargement des actualités…</p></div>
</div>

<div id="authSection"></div>

<section class="newsletter-section">
    <div class="newsletter-box">
        <h2>📬 Restez informé</h2>
        <p>Recevez l'édition du soir directement par e-mail, chaque jour.</p>
        <form class="newsletter-form" id="newsletterForm">
            <input type="email" id="newsletterEmail" placeholder="vous@exemple.cm" required>
            <button type="submit" class="btn btn-primary">S'abonner</button>
        </form>
        <p id="newsletterMsg" style="margin-top:14px; font-size:0.85rem;"></p>
    </div>
</section>

<div id="site-footer"></div>

<script>window.KMER_API_BASE = 'api';</script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/home.js"></script>
<script>
renderHeader('.');
renderFooter('.');
document.getElementById('editionDate').textContent = "Édition du " + new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
loadHomePage();
document.addEventListener('kmer:session-ready', (e) => renderHeroAndAuth(e.detail));

document.getElementById('newsletterForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('newsletterEmail').value.trim();
    const msg = document.getElementById('newsletterMsg');
    const r = await KmerAPI.postJson('contact.php', {
        nom: 'Newsletter', email, sujet: 'Inscription newsletter', contenu: 'Nouvelle inscription à la newsletter Kmer News.'
    });
    msg.textContent = r.data.success ? '✅ Merci ! Vous êtes inscrit(e) à la newsletter.' : (r.data.message || 'Une erreur est survenue.');
    if (r.data.success) e.target.reset();
});
</script>
</body>
</html>
