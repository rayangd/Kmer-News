<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord — Kmer News Admin</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<link rel="icon" href="data:,">
</head>
<body>
<div id="admin-root"></div>

<script>window.KMER_API_BASE = '../api';</script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/admin-layout.js"></script>
<script>
(async () => {
    const admin = await guardAdminPage();
    if (!admin) return;
    renderAdminLayout(admin, 'dashboard', 'Tableau de bord');

    const data = await KmerAPI.get('admin/dashboard.php');
    if (!data.success) { adminFlash('error', data.message); return; }

    const s = data.stats;
    let html = `
    <div class="stats-row">
        <div class="stat-card"><div class="icon">📰</div><div class="num">${s.articles}</div><div class="label">Articles publiés ${s.brouillons ? `· ${s.brouillons} brouillon(s)` : ''}</div></div>
        <div class="stat-card c-sport"><div class="icon">👁</div><div class="num">${s.vues}</div><div class="label">Vues cumulées</div></div>
        <div class="stat-card c-culture"><div class="icon">👥</div><div class="num">${s.users}</div><div class="label">Utilisateurs inscrits</div></div>
        <div class="stat-card c-musique"><div class="icon">💬</div><div class="num">${s.comments}</div><div class="label">Commentaires</div></div>
    </div>`;

    if (s.messages_non_lus > 0) {
        html += `<div class="alert alert-info">📬 Vous avez <strong>${s.messages_non_lus}</strong> nouveau(x) message(s) de contact non lu(s). <a href="messages.html" style="font-weight:800;">Voir les messages →</a></div>`;
    }
    if (s.propositions_lecteurs > 0) {
        html += `<div class="alert alert-info">✍️ <strong>${s.propositions_lecteurs}</strong> article(s) proposé(s) par des lecteurs en attente de relecture. <a href="articles.html?statut=brouillon" style="font-weight:800;">Voir les propositions →</a></div>`;
    }

    html += `<div class="panel"><div class="panel-head"><h3>Répartition des articles par rubrique</h3></div>
        <div class="panel-body"><div class="stats-row" style="margin-bottom:0;">` +
        data.cat_stats.map(cs => `
            <div class="stat-card" style="border-top-color:${cs.couleur};">
                <div class="num">${cs.count}</div>
                <div class="label"><span class="color-dot" style="background:${cs.couleur}"></span>${escapeHtml(cs.nom)}</div>
            </div>`).join('') +
        `</div></div></div>`;

    html += `<div class="form-grid-2">
        <div class="panel">
            <div class="panel-head"><h3>Derniers articles</h3><a href="articles.html" class="btn btn-sm btn-ghost">Voir tout</a></div>
            <table class="admin-table"><thead><tr><th>Titre</th><th>Rubrique</th><th>Statut</th><th>Vues</th></tr></thead><tbody>` +
            (data.recent_articles.length === 0 ? `<tr><td colspan="4">Aucun article pour le moment.</td></tr>` :
            data.recent_articles.map(a => `
                <tr>
                    <td><a href="article_form.html?id=${a.id}" style="font-weight:700;">${escapeHtml(excerpt(a.titre, 40))}</a></td>
                    <td><span class="color-dot" style="background:${a.cat_couleur}"></span>${escapeHtml(a.cat_nom)}</td>
                    <td>${a.statut === 'publie' ? '<span class="badge badge-green">Publié</span>' : '<span class="badge badge-yellow">Brouillon</span>'}</td>
                    <td>${a.vues}</td>
                </tr>`).join('')) +
            `</tbody></table>
        </div>
        <div class="panel">
            <div class="panel-head"><h3>Derniers commentaires</h3></div>
            <div class="panel-body" style="padding-top:8px;">` +
            (data.recent_comments.length === 0 ? `<p style="color:var(--text-muted); font-size:0.88rem;">Aucun commentaire pour le moment.</p>` :
            data.recent_comments.map(c => `
                <div class="comment" style="padding:12px 0;">
                    <span class="avatar-mini">${escapeHtml((c.prenom||'?').charAt(0).toUpperCase())}</span>
                    <div class="body">
                        <span class="who" style="font-size:0.85rem;">${escapeHtml(c.prenom)} ${escapeHtml(c.nom)}<span class="when">${timeAgo(c.created_at)}</span></span>
                        <p class="text" style="font-size:0.85rem;">${escapeHtml(excerpt(c.contenu, 70))}</p>
                        <a href="../article.html?slug=${encodeURIComponent(c.article_slug)}" style="font-size:0.78rem; color:var(--blue); font-weight:700;" target="_blank">Voir l'article →</a>
                    </div>
                </div>`).join('')) +
            `</div>
        </div>
    </div>`;

    document.getElementById('adminBody').innerHTML = html;
})();
</script>
</body>
</html>
